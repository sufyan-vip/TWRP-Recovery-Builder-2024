name: Build TWRP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip

      - name: Build and Sync
        run: |
          # 1. Setup workspace
          mkdir workspace
          cd workspace
          
          # 2. Repo Init and Sync
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-14.0
          repo sync -j$(nproc)
          
          # 3. Setup Device Tree
          mkdir -p device/realme/ussi_arm64
          cp -r ../* device/realme/ussi_arm64/
          rm -rf device/realme/ussi_arm64/.github
          
          # 4. BUILD (Yeh sab ek hi block mein hona chahiye)
          source build/envsetup.sh
          lunch omni_ussi_arm64-eng
          make -j$(nproc) recoveryimage
